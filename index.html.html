<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DACO</title>
<style>
*{box-sizing:border-box}
:root{--ink:#171717;--muted:#777;--line:#ece9e4;--soft:#f5f3ef}
body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;color:var(--ink);background:white}
a{color:inherit;text-decoration:none}
button,input,textarea{font:inherit}
header{padding:22px 6%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);z-index:20}
.logo{font-weight:800;letter-spacing:.25em;cursor:pointer}
header nav{display:flex;gap:18px;font-size:12px}
.hero{padding:70px 6% 55px;background:var(--soft)}
.hero small{letter-spacing:.18em;color:var(--muted)}
.hero h1{font-size:clamp(38px,7vw,72px);margin:12px 0 14px;letter-spacing:-.06em;line-height:1.05}
.hero p{color:#666;line-height:1.7}
main{padding:55px 6% 90px}
.top{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:25px}
h2{margin:0;font-size:28px}
#status{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.card{cursor:pointer}
.card img,.ph{width:100%;aspect-ratio:3/4;object-fit:cover;background:#eeeae4;border-radius:12px}
.ph{display:grid;place-items:center;letter-spacing:.2em;color:#999}
.name{font-weight:700;margin:13px 0 6px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.price{font-size:14px}
.stock{font-size:11px;color:var(--muted)}
.buy{display:inline-block;margin-top:12px;padding:10px 14px;background:#171717;color:#fff;border:none;border-radius:999px;font-size:12px;cursor:pointer}
.buy.off{background:#bbb;pointer-events:none}
.hidden{display:none!important}
.purchase-wrap{max-width:980px;margin:0 auto}
.purchase-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.back-btn{border:1px solid #ddd;background:white;border-radius:999px;padding:9px 14px;cursor:pointer;font-size:12px}
.purchase-grid{display:grid;grid-template-columns:1fr 1fr;gap:46px;align-items:start}
.purchase-media img,.purchase-media .ph{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:14px;background:#eeeae4}
.kicker{font-size:11px;letter-spacing:.14em;color:var(--muted)}
.purchase-name{font-size:32px;font-weight:700;margin:10px 0 12px}
.purchase-price{font-size:21px;margin-bottom:14px}
.purchase-stock{font-size:12px;color:var(--muted);margin-bottom:22px}
.box{border-top:1px solid var(--line);padding-top:20px;margin-top:20px}
.qty{display:flex;align-items:center;gap:12px;margin:12px 0 22px}
.qty button{width:34px;height:34px;border:1px solid #ddd;background:#fff;border-radius:50%;cursor:pointer}
.qty strong{min-width:24px;text-align:center}
.total{display:flex;justify-content:space-between;font-size:18px;font-weight:700;margin:20px 0}
.form label{display:block;font-size:12px;font-weight:700;margin:15px 0 7px}
.form input,.form textarea{width:100%;padding:12px 13px;border:1px solid #ddd;border-radius:9px}
.form textarea{min-height:90px;resize:vertical}
.pay-btn{display:block;width:100%;margin-top:22px;padding:15px 18px;text-align:center;background:#171717;color:#fff;border-radius:999px;font-size:14px}
.pay-btn.off{background:#bbb;pointer-events:none}
.note{margin-top:14px;padding:13px 14px;background:var(--soft);border-radius:10px;color:#666;font-size:12px;line-height:1.6}
footer{padding:28px 6%;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
@media(max-width:760px){
  .grid{grid-template-columns:repeat(2,1fr);gap:14px}
  .hero{padding-top:50px}
  .purchase-grid{grid-template-columns:1fr;gap:28px}
  main{padding-left:18px;padding-right:18px}
}
</style>
</head>
<body>
<header>
  <div class="logo" id="homeLogo">DACO</div>
  <nav>
    <a href="#shop" id="shopNav">SHOP</a>
  </nav>
</header>

<section class="hero" id="hero">
  <small>EVERYDAY, WELL DRESSED.</small>
  <h1>오늘의 코디,<br>다코와 함께.</h1>
  <p>함께 입기 좋은 옷을 고릅니다.</p>
</section>

<main>
  <section id="shopView">
    <div class="top">
      <h2>SHOP</h2>
      <div id="status">Google Sheets 연결 중…</div>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <section id="purchaseView" class="hidden">
    <div class="purchase-wrap">
      <div class="purchase-head">
        <h2>구매하기</h2>
        <button class="back-btn" id="backToShop">← 상품 목록</button>
      </div>
      <div id="purchaseContent"></div>
    </div>
  </section>
</main>

<footer>© 2026 DACO</footer>

<script>
const SHEET_ID="1gNzjLMUddT6paLsr2UQnVB_64-iE6hlg3hmtQeuUAKU";
const SHEET_GID="134925099";
let products=[];
let currentProduct=null;
let qty=1;

const grid=document.getElementById("grid");
const statusEl=document.getElementById("status");
const shopView=document.getElementById("shopView");
const purchaseView=document.getElementById("purchaseView");
const hero=document.getElementById("hero");
const purchaseContent=document.getElementById("purchaseContent");

function val(cell){return cell?(cell.f??cell.v??""):"";}
function money(v){
  const n=Number(String(v).replace(/[^0-9.-]/g,""));
  return Number.isFinite(n)?Math.round(n).toLocaleString("ko-KR")+"원":String(v||"");
}
function num(v){
  const n=Number(String(v).replace(/[^0-9.-]/g,""));
  return Number.isFinite(n)?n:0;
}
function norm(s){return String(s||"").trim().toLowerCase().replace(/[\s_\-\/()]/g,"");}
function pick(headers,names){const ns=names.map(norm);return headers.findIndex(h=>ns.includes(h));}

function loadProducts(){
  const cb="daco_"+Date.now();
  window[cb]=res=>{
    try{
      if(!res||res.status!=="ok")throw new Error("sheet");
      const t=res.table,headers=t.cols.map(c=>norm(c.label||c.id));
      let ni=pick(headers,["상품명","제품명","name"]);
      let pi=pick(headers,["가격","판매가","price"]);
      let ii=pick(headers,["이미지URL","이미지","사진","image"]);
      let si=pick(headers,["재고","재고수량","수량","stock"]);
      let li=pick(headers,["구매링크","주문링크","상품URL","링크","url"]);
      if(ni<0)ni=0;if(pi<0)pi=1;if(ii<0)ii=2;if(si<0)si=3;if(li<0)li=5;
      products=t.rows.map((r,i)=>({
        id:i,
        name:val(r.c[ni]),
        price:val(r.c[pi]),
        image:val(r.c[ii]),
        stock:val(r.c[si]),
        link:val(r.c[li])
      })).filter(x=>x.name);
      renderShop();
      routeFromHash();
    }catch(e){
      statusEl.textContent="시트 공유 설정을 확인해 주세요.";
    }
    try{delete window[cb]}catch(e){}
    document.getElementById(cb)?.remove();
  };
  const s=document.createElement("script");s.id=cb;
  s.src=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${SHEET_GID}&headers=1&tqx=out:json;responseHandler:${cb}&_=${Date.now()}`;
  s.onerror=()=>statusEl.textContent="시트를 불러오지 못했습니다.";
  document.head.appendChild(s);
}

function renderShop(){
  grid.innerHTML="";
  statusEl.textContent=products.length+"개 상품 · 시트 연동됨";
  products.forEach(p=>{
    const stockNum=Number(String(p.stock).replace(/[^0-9.-]/g,""));
    const hasStock=String(p.stock).trim()!==""&&Number.isFinite(stockNum);
    const sold=hasStock&&stockNum<=0;
    const card=document.createElement("article");card.className="card";
    const media=p.image?`<img src="${p.image}" alt="">`:`<div class="ph">DACO</div>`;
    const btn=!sold?`<button class="buy" data-id="${p.id}">구매하기</button>`:`<span class="buy off">품절</span>`;
    card.innerHTML=`${media}<div class="name">${p.name}</div><div class="row"><span class="price">${money(p.price)}</span><span class="stock">${sold?"SOLD OUT":(hasStock?"재고 "+stockNum:"")}</span></div>${btn}`;
    grid.appendChild(card);
  });
  grid.querySelectorAll(".buy[data-id]").forEach(btn=>{
    btn.addEventListener("click",()=>openPurchase(Number(btn.dataset.id)));
  });
}

function openPurchase(id){
  const p=products.find(x=>x.id===id);
  if(!p)return;
  currentProduct=p;qty=1;
  location.hash="buy-"+id;
  renderPurchase(p);
  shopView.classList.add("hidden");
  hero.classList.add("hidden");
  purchaseView.classList.remove("hidden");
  window.scrollTo({top:0,behavior:"smooth"});
}

function renderPurchase(p){
  const stockNum=Number(String(p.stock).replace(/[^0-9.-]/g,""));
  const hasStock=String(p.stock).trim()!==""&&Number.isFinite(stockNum);
  const sold=hasStock&&stockNum<=0;
  const media=p.image?`<img src="${p.image}" alt="">`:`<div class="ph">DACO</div>`;
  purchaseContent.innerHTML=`
    <div class="purchase-grid">
      <div class="purchase-media">${media}</div>
      <div>
        <div class="kicker">DACO PRODUCT</div>
        <div class="purchase-name">${p.name}</div>
        <div class="purchase-price">${money(p.price)}</div>
        <div class="purchase-stock">${sold?"SOLD OUT":(hasStock?"재고 "+stockNum+"개":"판매중")}</div>

        <div class="box">
          <div>수량</div>
          <div class="qty">
            <button id="minus">−</button>
            <strong id="qty">1</strong>
            <button id="plus">+</button>
          </div>
          <div class="total">
            <span>총 상품금액</span>
            <span id="total">${money(p.price)}</span>
          </div>
        </div>

        <div class="form">
          <label>주문자명</label>
          <input placeholder="이름">
          <label>연락처</label>
          <input placeholder="010-0000-0000">
          <label>배송지</label>
          <input placeholder="주소">
          <label>배송 메모</label>
          <textarea placeholder="배송 시 요청사항"></textarea>
        </div>

        ${p.link&&!sold
          ? `<a class="pay-btn" href="${p.link}" target="_blank" rel="noreferrer">결제 페이지로 이동</a>`
          : `<span class="pay-btn off">${sold?"품절":"결제 링크 준비중"}</span>`}

        <div class="note">
          실제 결제는 Google Sheets의 <b>구매링크</b>에 입력한 판매/결제 페이지에서 완료됩니다.
        </div>
      </div>
    </div>`;

  const qtyEl=document.getElementById("qty");
  const totalEl=document.getElementById("total");
  const update=()=>{
    qtyEl.textContent=qty;
    totalEl.textContent=(num(p.price)*qty).toLocaleString("ko-KR")+"원";
  };
  document.getElementById("minus").onclick=()=>{if(qty>1){qty--;update();}};
  document.getElementById("plus").onclick=()=>{if(!hasStock||qty<stockNum){qty++;update();}};
}

function showShop(){
  location.hash="shop";
  purchaseView.classList.add("hidden");
  shopView.classList.remove("hidden");
  hero.classList.remove("hidden");
  document.getElementById("shop")?.scrollIntoView({behavior:"smooth"});
}

function routeFromHash(){
  const h=location.hash||"#shop";
  if(h.startsWith("#buy-")){
    const id=Number(h.replace("#buy-",""));
    const p=products.find(x=>x.id===id);
    if(p){renderPurchase(p);shopView.classList.add("hidden");hero.classList.add("hidden");purchaseView.classList.remove("hidden");}
  }else{
    purchaseView.classList.add("hidden");shopView.classList.remove("hidden");hero.classList.remove("hidden");
  }
}

document.getElementById("backToShop").onclick=showShop;
document.getElementById("homeLogo").onclick=()=>{location.hash="shop";routeFromHash();window.scrollTo({top:0,behavior:"smooth"});};
document.getElementById("shopNav").onclick=()=>{location.hash="shop";setTimeout(routeFromHash,0);};
window.addEventListener("hashchange",routeFromHash);

loadProducts();
setInterval(loadProducts,30000);
</script>
</body>
</html>
